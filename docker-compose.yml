name: ab-blog

services:
  nginx:
    image: nginx:1.30-alpine
    container_name: ab-blog-nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - blog

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ab-blog-php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_ENV: ${APP_ENV}
      APP_URL: ${APP_URL}
      ARTICLES_PER_PAGE: ${ARTICLES_PER_PAGE}
    depends_on:
      - mysql
    networks:
      - blog

  mysql:
    image: mysql:8.4
    container_name: ab-blog-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=3306
      - --bind-address=0.0.0.0
    networks:
      - blog

volumes:
  mysql-data:

networks:
  blog:
    driver: bridge
